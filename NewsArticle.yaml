model:
  # Recommend using ChatGPT or DeepSeek APIs for complex IE task.
  category: Qwen # model category, chosen from ChatGPT, DeepSeek, LLaMA, Qwen, ChatGLM, MiniCPM, OneKE.
  model_name_or_path: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B # # model name, chosen from the model list of the selected category.
  api_key: "" # your API key for the model with API service. No need for open-source models.
  base_url: "" # # base URL for the API service. No need for open-source models.
  device: auto # device to run the model, chosen from auto, cpu, cuda, cuda:0 etc. Default set to auto.

extraction:
  task: Triple # task type, chosen from Base, NER, RE, EE, Triple
  instruction: >
    Extract only causal factual triples directly supported by the text.

    A valid triple must describe a clear cause → effect relationship that is 
    explicitly stated in the text using terms such as “causes,” “leads to,” 
    “results in,” “drives,” “because,” “due to,” “increases,” or “reduces.”

    Exclude any triple that does NOT express causality. 
    Do NOT extract:
    - stock price movements (“up,” “down,” “drops,” “rises”)
    - companies being “in talks,” “considering,” “planning”
    - correlations without explicit causal wording
    - market context mentions appearing together in one article
    - non-causal events (meetings, negotiations, announcements)
    - performance descriptors (“Alphabet is up 2%”)

    Do NOT infer or imagine causal links. 
    Only extract causal relations found verbatim in the text.

    Use the exact wording from the text for head, relation, and tail.
    Head and tail must be different and non-empty.

    Output each causal statement as a separate triple in this format:
    {
      "head": "",
      "head_type": "",
      "relation": "",
      "relation_type": "",
      "tail": "",
      "tail_type": ""
    }
    Only output JSON. No explanation, no chain-of-thought, no commentary.
    
  constraint: []
  use_file: true # whether to use a file for the input text. Default set to false.
  file_path: FinancialPapers/Nvidia stock drops after report of Meta considering multi-billion-dollar deal for Google AI chips _ Seeking Alpha.pdf #  # path to the input file. No need if use_file is set to false.
  mode: customized # extraction mode, chosen from quick, detailed, customized. Default set to quick. See src/config.yaml for more details.
  update_case: false # whether to update the case repository. Default set to false.
  show_trajectory: false # whether to display the extracted intermediate steps

